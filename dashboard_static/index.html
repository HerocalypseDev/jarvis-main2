<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">JARVIS <span class="brand-sub">Supervision</span></div>
  <div id="approval-queue" class="approval-queue">
    <span class="approval-empty">No pending confirmations</span>
  </div>
  <div id="input-mode-chip" class="input-mode-chip">idle</div>
  <div id="llm-chip" class="input-mode-chip llm-chip" title="Which AI brain answers — click to switch">brain: &hellip;</div>
  <div id="spend-chip" class="input-mode-chip spend-chip" title="Estimated Claude spend today (Jarvis only) — click for details">$&ndash; today</div>
  <div class="services-dropdown">
    <button class="btn btn-ghost" id="services-toggle-btn">Services &#9662;</button>
    <div id="services-panel" class="services-panel hidden">
      <p class="muted">Loading&hellip;</p>
    </div>
  </div>
  <div id="conn-status" class="conn-status offline">connecting&hellip;</div>
</header>

<div id="metrics-strip" class="metrics-strip"></div>

<main class="layout">
  <section class="col col-sessions">
    <div class="col-header">
      <h2>Sessions</h2>
      <button class="btn btn-ghost btn-small" id="clear-sessions-btn">Clear finished</button>
    </div>
    <ul id="sessions-list" class="list"></ul>
  </section>
  <section class="col col-tasks">
    <h2>Tasks</h2>
    <ul id="tasks-list" class="list"></ul>
  </section>
  <section class="col col-detail">
    <h2>Detail</h2>
    <form id="compose-form" class="compose-form">
      <input type="text" id="compose-input" placeholder="Send a command to Jarvis&hellip;" autocomplete="off" />
      <button class="btn" type="submit">Send</button>
    </form>
    <p id="compose-status" class="muted compose-status"></p>
    <div id="detail-panel" class="detail-panel">
      <p class="muted">Select a session or task to see details.</p>
    </div>
  </section>
</main>

<footer class="bottom">
  <div class="bottom-tabs">
    <button class="tab-btn active" data-tab="activity">Activity</button>
    <button class="tab-btn" data-tab="daily">Daily</button>
    <button class="tab-btn" data-tab="usage">Usage</button>
    <button class="tab-btn" data-tab="audit">Audit Trail</button>
    <button class="tab-btn" data-tab="victory">Victory Log</button>
  </div>
  <div id="tab-activity" class="tab-panel active">
    <ul id="activity-list" class="list compact"></ul>
  </div>
  <div id="tab-daily" class="tab-panel">
    <ul id="daily-list" class="list compact"></ul>
  </div>
  <div id="tab-usage" class="tab-panel">
    <div id="usage-cards" class="usage-cards"></div>
    <div class="usage-lower">
      <div id="usage-chart" class="usage-chart" aria-label="Daily spend, last 14 days"></div>
      <ul id="usage-models" class="list compact"></ul>
    </div>
    <p id="usage-note" class="muted"></p>
  </div>
  <div id="tab-audit" class="tab-panel">
    <div class="audit-filters">
      <input type="date" id="audit-date-from" title="From date" />
      <input type="date" id="audit-date-to" title="To date" />
      <select id="audit-tool"><option value="">All tools</option></select>
      <input type="text" id="audit-q" placeholder="Search input/result&hellip;" />
      <button class="btn" id="audit-apply-btn">Filter</button>
      <button class="btn btn-ghost" id="audit-clear-btn">Clear</button>
    </div>
    <ul id="audit-list" class="list compact"></ul>
  </div>
  <div id="tab-victory" class="tab-panel">
    <div id="victory-counts" class="victory-counts"></div>
    <ul id="victory-list" class="list compact"></ul>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
